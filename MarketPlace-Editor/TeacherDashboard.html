<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <a class="nav-link text-white" href="Index.html">Home</a>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4">Teacher Dashboard</h1>

    <!-- CONTROLLO VISITA -->
    <div class="card">
        <div class="card-body">
            <h2 class="h4" id="visitTitle"></h2>

            <h3 class="h5">
                Opera corrente:
                <span id="currentItem"></span>
            </h3>

            <p>
                Numero opera:
                <span id="currentIndex"></span>
            </p>

            <p>
                Stato:
                <span id="status"></span>
            </p>

            <button id="previousButton" class="btn btn-outline-secondary">Opera precedente</button>
            <button id="nextButton" class="btn btn-primary">Opera successiva</button>
            <button id="stopButton" class="btn btn-outline-danger">Termina visita</button>
        </div>
    </div>

    <div class="row g-3">
        <!-- DOMANDE STUDENTI -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h4">Domande degli studenti</h2>
                    <div id="questionsList"></div>
                </div>
            </div>
        </div>

        <!-- STUDENTI COLLEGATI -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h4">Studenti collegati</h2>
                    <div id="studentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <button id="quizEditorButton" class="btn btn-outline-primary">Gestisci Quiz</button>
        <button id="startQuizButton" class="btn btn-success">Avvia Quiz</button>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h4">Risultati quiz</h2>
            <div id="quizResults"></div>
        </div>
    </div>



</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/TeacherDashboard.js"></script>

</body>
</html>
