<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Area Docente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="TeacherVisitEditor.html">Area Docente</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4">Area Docente</h1>

    <div class="card">
        <div class="card-body">
            <h2 class="h4">Seleziona visita</h2>

            <div class="mb-3">
                <select id="visitSelect" class="form-select"></select>
            </div>

            <div class="border rounded p-3 mb-3">
                <h3 class="h5">Crea una nuova visita docente</h3>
                <input type="text" id="newVisitTitle" class="form-control mb-2" placeholder="Titolo della visita">
                <input type="text" id="newVisitCode" class="form-control" placeholder="Codice per gli studenti (facoltativo)">
                <button id="createVisitButton" class="btn btn-primary mt-2" type="button">Crea visita</button>
            </div>

            <div class="mb-3">
                <input type="text" id="syncCode" class="form-control" placeholder="Nome mnemonico (es. FeniceRossa)">
            </div>

            <button id="saveButton" class="btn btn-outline-primary">Salva configurazione</button>
            <button id="quizButton" class="btn btn-outline-secondary">Gestisci quiz</button>
            <button id="startButton" class="btn btn-success">Avvia gita</button>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h4">Visite preparate</h2>
            <div id="savedVisits"></div>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h4">Opere della visita</h2>
            <div id="itemsList"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/TeacherVisitEditor.js"></script>

</body>
</html>
