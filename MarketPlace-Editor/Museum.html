<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Il tuo museo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="Items.html">Item</a></li>
                <li class="nav-item"><a class="nav-link" href="Visits.html">Visite</a></li>
                <li class="nav-item"><a class="nav-link" href="ChooseVisit.html">Avvia</a></li>
                <li class="nav-item"><a class="nav-link active" href="Museum.html">Il tuo museo</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4">Il tuo museo</h1>

    <div class="card">
        <div class="card-body">
            <h2 class="h4">Informazioni museo</h2>

            <form id="museumForm">
                <div class="mb-3">
                    <input type="text" id="name" class="form-control" placeholder="Nome museo">
                </div>
                <div class="mb-3">
                    <input type="text" id="city" class="form-control" placeholder="Città">
                </div>
                <div class="mb-3">
                    <textarea id="description" class="form-control" placeholder="Descrizione"></textarea>
                </div>

                <h3 class="h5">Sale del museo</h3>
                <div id="roomsList"></div>

                <div class="row g-2 mb-2">
                    <div class="col-md-5">
                        <input type="text" id="newRoom" class="form-control" placeholder="Nome sala">
                    </div>
                    <div class="col-md-5">
                        <input type="text" id="newRoomDescription" class="form-control" placeholder="Descrizione sala">
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-secondary w-100" onclick="addRoom()">Aggiungi sala</button>
                    </div>
                </div>

                <h3 class="h5 mt-4">Visite disponibili</h3>
                <div id="visitsSelection"></div>

                <button type="submit" class="btn btn-success mt-3">Salva</button>
            </form>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">
            <h2 class="h4">Mappa (logica)</h2>
            <div id="museumMap"></div>
        </div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/Museum.js"></script>

</body>
</html>
