<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArtAround Staff</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><button class="nav-link btn btn-link" type="button" onclick="logout()">Esci</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="text-center">
        <h1 class="display-5 mb-3">ArtAround - Staff Panel</h1>
        <p class="lead text-muted">Prepara oggetti, visite e contenuti per i tuoi visitatori.</p>
    </div>

    <div class="row g-3 justify-content-center mt-4">
        <div class="col-md-4">
            <button type="button" class="btn btn-primary w-100 py-3 panel-tab" data-panel="items">Gestione Item</button>
        </div>
        <div class="col-md-4">
            <button type="button" class="btn btn-outline-primary w-100 py-3 panel-tab" data-panel="visits">Gestione Visite</button>
        </div>
        <div class="col-md-4">
            <button type="button" class="btn btn-outline-primary w-100 py-3 panel-tab" data-panel="choose">Avvia Visita</button>
        </div>
        <div class="col-md-4">
            <button type="button" class="btn btn-outline-primary w-100 py-3 panel-tab" data-panel="teacher">Area Docente</button>
        </div>
        <div class="col-md-4">
            <button type="button" class="btn btn-outline-primary w-100 py-3 panel-tab" data-panel="museum">Il tuo museo</button>
        </div>
    </div>

    <hr class="my-4">

    <!-- Contiene solo il pannello selezionato: gli altri non vengono mai renderizzati insieme -->
    <div id="panelContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/Index.js"></script>
</body>
</html>
