<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso staff | ArtAround</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-intro">
        <p class="eyebrow">ARTAROUND / STAFF</p>
        <h1>Il tuo museo,<br>in buone mani.</h1>
        <p>Accedi all'area privata per curare contenuti, visite e sale del museo associato al tuo account.</p>
    </section>
    <section class="login-panel" aria-labelledby="loginTitle">
        <p class="eyebrow">ACCESSO RISERVATO</p>
        <h2 id="loginTitle">Bentornato</h2>
        <form id="loginForm" novalidate>
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" autocomplete="username" required>
            <label class="form-label mt-3" for="password">Password</label>
            <input class="form-control" id="password" type="password" autocomplete="current-password" required>
            <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
            <button class="btn btn-dark w-100 mt-3" type="submit">Accedi all'editor <span aria-hidden="true">→</span></button>
        </form>
    </section>
</main>
<script src="JAVASCRIPT/Login.js"></script>
</body>
</html>
