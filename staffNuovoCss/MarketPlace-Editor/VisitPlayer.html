<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visita</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<div class="container py-4" style="max-width: 640px;">

    <!-- VISITA CORRENTE -->
    <div class="card">
        <div class="card-body">
            <h1 class="h3" id="visitTitle"></h1>

            <hr>

            <h2 class="h4" id="itemTitle"></h2>

            <p id="itemText"></p>

            <button id="nextButton" class="btn btn-primary w-100">Avanti</button>
        </div>
    </div>

    <!-- DOMANDA ALLA DOCENTE -->
    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h5">Hai una domanda?</h2>

            <div class="mb-3">
                <textarea id="questionInput" class="form-control" placeholder="Scrivi qui la tua domanda..."></textarea>
            </div>

            <button id="sendQuestionButton" class="btn btn-outline-primary">Invia domanda</button>
        </div>
    </div>

    <!-- QUIZ FINALE -->
    <div id="quizContainer" class="mt-3"></div>

    <button id="sendQuizButton" class="btn btn-success w-100 mt-3" style="display:none;">Invia risposte</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/VisitPlayer.js"></script>

</body>
</html>
