<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contenuti privati</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <div>
            <a class="nav-link d-inline text-white me-3" href="Index.html">Home</a>
            <a class="nav-link d-inline text-white" id="backButton" href="#">Torna alla visita</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4">Contenuti privati</h1>

    <!-- Informazioni opera -->
    <div class="card">
        <div class="card-body">
            <h2 class="h4" id="itemTitle">Opera</h2>
            <p>
                Qui puoi aggiungere contenuti visibili solo agli studenti
                durante questa visita sincronizzata.
            </p>
        </div>
    </div>

    <!-- Aggiunta contenuto -->
    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h4">Nuovo contenuto</h2>

            <div class="mb-3">
                <input type="text" id="titleInput" class="form-control" placeholder="Titolo contenuto">
            </div>

            <div class="mb-3">
                <select id="typeInput" class="form-select">
                    <option value="text">Testo</option>
                    <option value="image">Immagine</option>
                    <option value="pdf">PDF</option>
                    <option value="video">Video</option>
                </select>
            </div>

            <div class="mb-3">
                <textarea id="textInput" class="form-control" rows="6" placeholder="Scrivi il testo (solo se scegli Testo)"></textarea>
            </div>

            <div class="mb-3">
                <input type="text" id="urlInput" class="form-control" placeholder="URL immagine / PDF / Video">
            </div>

            <button id="saveButton" class="btn btn-success">Aggiungi contenuto</button>
        </div>
    </div>

    <!-- Lista contenuti -->
    <div class="card mt-3">
        <div class="card-body">
            <h2 class="h4">Contenuti già presenti</h2>

            <div id="contentsList">
                Nessun contenuto.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/TeacherPrivateContents.js"></script>

</body>
</html>
