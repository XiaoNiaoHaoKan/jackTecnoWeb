<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="TeacherVisitEditor.html">Area docente</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-3">Gestione Quiz</h1>

    <button id="backButton" class="btn btn-outline-secondary mb-3">Torna alla dashboard</button>

    <div class="card">
        <div class="card-body">
            <h2 class="h4">Nuova domanda</h2>

            <div class="mb-3">
                <input id="questionInput" type="text" class="form-control" placeholder="Scrivi la domanda">
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <input id="answer0" type="text" class="form-control" placeholder="Risposta A">
                </div>
                <div class="col-md-6">
                    <input id="answer1" type="text" class="form-control" placeholder="Risposta B">
                </div>
                <div class="col-md-6">
                    <input id="answer2" type="text" class="form-control" placeholder="Risposta C">
                </div>
                <div class="col-md-6">
                    <input id="answer3" type="text" class="form-control" placeholder="Risposta D">
                </div>
            </div>

            <p>Risposta corretta</p>

            <div class="mb-3" style="max-width: 200px;">
                <select id="correctIndex" class="form-select">
                    <option value="0">A</option>
                    <option value="1">B</option>
                    <option value="2">C</option>
                    <option value="3">D</option>
                </select>
            </div>

            <button id="saveButton" class="btn btn-success">Salva domanda</button>
            <button id="startQuizButton" class="btn btn-primary">Avvia quiz</button>
        </div>
    </div>

    <h2 class="h4 mt-4">Domande del quiz</h2>
    <div id="quizList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/TeacherQuizEditor.js"></script>

</body>
</html>
