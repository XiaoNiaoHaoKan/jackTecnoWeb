<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestione Visite</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="Index.html">ArtAround</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="Items.html">Item</a></li>
                <li class="nav-item"><a class="nav-link active" href="Visits.html">Visite</a></li>
                <li class="nav-item"><a class="nav-link" href="ChooseVisit.html">Avvia</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="mb-4">Gestione Visite</h1>

    <!-- FORM -->
    <div class="card">
        <div class="card-body">
            <h2 class="h4">Crea / Modifica Visita</h2>

            <form id="visitForm">

                <div class="mb-3">
                    <input type="text" id="title" class="form-control" placeholder="Titolo visita" required>
                </div>

                <div class="form-check checkbox-row mb-3">
                    <input type="checkbox" id="synchronized" class="form-check-input">
                    <label class="form-check-label" for="synchronized">Visita sincronizzata?</label>
                </div>

                <h3 class="h5">Seleziona gli item</h3>
                <div id="itemsCheckboxList"></div>

                <h3 class="h5 mt-3">Sequenza della visita (trascina per riordinare)</h3>
                <div id="sequenceList"></div>

                <button type="submit" class="btn btn-success mt-3">Salva Visita</button>
            </form>
        </div>
    </div>

    <!-- LISTA VISITE -->
    <div class="card mt-4">
        <div class="card-body">
            <h2 class="h4">Lista Visite</h2>

            <div id="visitsList"></div>
        </div>
    </div>

</div>

<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JAVASCRIPT/API.js"></script>
<script src="JAVASCRIPT/Visits.js"></script>

</body>
</html>
